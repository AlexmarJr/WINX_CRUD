services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: winx
      POSTGRES_USER: winx
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=25"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winx -d winx"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: winx-backend:oci
    pull_policy: never
    restart: unless-stopped
    environment: &backend_environment
      APP_NAME: Winx
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: winx
      DB_USERNAME: winx
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SANCTUM_STATEFUL_DOMAINS: ${APP_DOMAIN}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SEARCH_DRIVER: database
      MAIL_MAILER: brevo
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: Winx
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN}
      BREVO_KEY: ${BREVO_KEY}
      OPENROUTER_KEY: ${OPENROUTER_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
    volumes:
      - backend_storage:/var/www/html/storage
    command: ["sh", "-c", "php artisan migrate --force && exec php artisan serve --host=0.0.0.0 --port=8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  queue:
    image: winx-backend:oci
    pull_policy: never
    restart: unless-stopped
    environment: *backend_environment
    volumes:
      - backend_storage:/var/www/html/storage
    command: ["php", "artisan", "queue:work", "database", "--queue=emails,search,default", "--sleep=2", "--tries=3", "--max-time=3600"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'queue:work' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: winx-frontend:oci
    pull_policy: never
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL}
      NODE_OPTIONS: --max-old-space-size=256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_storage:
