services:
  backend:
    build: ./backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      SEARCH_DRIVER: elasticsearch
      ELASTICSEARCH_URL: http://elasticsearch:9200
    command: >
      sh -c 'set -e;
      test -f .env || cp .env.example .env;
      composer install --no-interaction;
      grep -q "^APP_KEY=base64:" .env || php artisan key:generate --force;
      php artisan migrate --force;
      php artisan serve --host=0.0.0.0 --port=8000'
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  queue:
    build: ./backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      SEARCH_DRIVER: elasticsearch
      ELASTICSEARCH_URL: http://elasticsearch:9200
    command: php artisan queue:work database --queue=emails,search,default --sleep=1 --tries=3
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      NUXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.0.1}
      NUXT_PUBLIC_APP_ENV: ${APP_ENV:-production}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: winx
      POSTGRES_USER: winx
      POSTGRES_PASSWORD: winx_local_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winx -d winx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  postgres_data:
  elasticsearch_data:
